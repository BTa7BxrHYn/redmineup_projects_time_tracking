  ptt_help_legend_e_closed: "сумма оценок закрытых задач"
  ptt_help_legend_f: "фактические трудозатраты"

  # ── Settings validation warnings ──
  ptt_warn_budget_missing: "Выбранное поле бюджета не существует"
  ptt_warn_budget_not_numeric: "Поле бюджета должно быть числовым (текущий тип: %{format})"
  ptt_warn_budget_not_selected: "Поле бюджета не выбрано - метрики не будут отображаться"
  ptt_warn_start_date_missing: "Выбранное поле начала проекта не существует"
  ptt_warn_end_date_missing: "Выбранное поле окончания проекта не существует"
  ptt_warn_start_date_type: "Поле начала должно быть типа 'дата'"
  ptt_warn_end_date_type: "Поле окончания должно быть типа 'дата'"
  ptt_warn_comment_missing: "Выбранное поле комментария не существует"
  ptt_warn_comment_type: "Поле комментария должно быть текстовым (текущий тип: %{format})"
  ptt_warn_no_closed_statuses: 'Не выбраны статусы "Закрыто" - прогресс всегда будет 0%'
  ptt_warn_statuses_deleted: "Некоторые выбранные статусы удалены (ID: %{ids})"

  # ── Metric tooltips ──
  ptt_tt_progress: |-
    Прогресс (% выполнения работы)
    ════════════════════════════════
    Формула: E_closed / E_total × 100%
    ════════════════════════════════
    E_total (сумма оценок): %{e_total} ч
    E_closed (закрытые): %{e_closed} ч
    ════════════════════════════════
    Расчёт: %{e_closed} / %{e_total} × 100% = %{result}
  ptt_tt_spent: |-
    Освоение (% расхода бюджета)
    ════════════════════════════════
    Формула: F / B × 100%
    ════════════════════════════════
    F (факт. трудозатраты): %{f} ч
    B (бюджет): %{budget} ч
    ════════════════════════════════
    Расчёт: %{f} / %{budget} × 100% = %{result}
  ptt_tt_cpi: |-
    CPI — Эффективность
    ════════════════════════════════
    Формула: E_closed / F
    ════════════════════════════════
    E_closed: %{e_closed} ч
    F (факт): %{f} ч
    ════════════════════════════════
    Расчёт: %{e_closed} / %{f} = %{cpi}
    ════════════════════════════════
    %{status_icon} %{status_text}
  ptt_tt_eac: |-
    EAC — Прогноз итоговых затрат
    ════════════════════════════════
    Формула: E_total / CPI
    ════════════════════════════════
    E_total: %{e_total} ч
    CPI: %{cpi}
    ════════════════════════════════
    Расчёт: %{e_total} / %{cpi} = %{eac} ч
  ptt_tt_variance: |-
    Variance — Отклонение от бюджета
    ════════════════════════════════
    Формула: B - EAC
    ════════════════════════════════
    B (бюджет): %{budget} ч
    EAC (прогноз): %{eac} ч
    ════════════════════════════════
    Расчёт: %{budget} - %{eac} = %{variance} ч
    (%{variance_percent})
    ════════════════════════════════
    %{status}
